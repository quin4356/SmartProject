<mat-sidenav-container class="shell">
  <mat-sidenav #nav mode="over" class="nav">
    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active" (click)="nav.close()">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>
      <a mat-list-item routerLink="/calendar" routerLinkActive="active" (click)="nav.close()">
        <mat-icon matListItemIcon>calendar_month</mat-icon>
        <span matListItemTitle>Kalender</span>
      </a>
      <a mat-list-item routerLink="/to-read" routerLinkActive="active" (click)="nav.close()">
        <mat-icon matListItemIcon>bookmark</mat-icon>
        <span matListItemTitle>Te lezen / bekijken</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    <app-account-menu (menuToggle)="nav.toggle()" />
    <router-outlet />
    <footer class="footer">
      © 2026 SMARTPROJECT. ALL RIGHTS RESERVED.
      <br />
      This product uses the TMDB API but is not endorsed or certified by TMDB.
      <br />
      <a routerLink="/privacy">Privacybeleid</a> · <a routerLink="/terms">Gebruiksvoorwaarden</a>
    </footer>
  </mat-sidenav-content>
</mat-sidenav-container>
