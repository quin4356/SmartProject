# Netlify: bouwt de Angular-app in frontend/ en publiceert de statische bestanden.
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist/smartproject-web/browser"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: elke route (bv. /dashboard) laadt index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Bestanden met een hash in de naam veranderen nooit: lang cachen.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://wcbxqcojasjmegkkbbjx.supabase.co wss://wcbxqcojasjmegkkbbjx.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
