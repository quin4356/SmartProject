# Cache-Control alleen voor bestanden met een hash in de naam (js/css).
# Via map in plaats van add_header in een location: anders vallen de headers hieronder weg.
map $uri $cache_control {
  ~*\.(js|css)$ "public, max-age=31536000, immutable";
  default "";
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  add_header Cache-Control $cache_control;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://wcbxqcojasjmegkkbbjx.supabase.co wss://wcbxqcojasjmegkkbbjx.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

  # Ontbrekende js/css geeft 404 in plaats van index.html.
  location ~* \.(js|css)$ {
    try_files $uri =404;
  }

  # Single-page app: elke route (bv. /dashboard) laadt index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
